version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "Europe/Vienna"

    # Wait before proposing freshly published versions (supply-chain safety).
    cooldown:
      default-days: 3
      semver-major-days: 7

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore"
      include: "scope"

    groups:
      # All minor/patch bumps land in one weekly PR. Major bumps are left
      # ungrouped so each breaking upgrade gets its own PR and can be
      # reviewed or deferred without blocking the rest.
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
